<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Melati app icon - concept v5 #2 "charcoal + navy underlay" (chosen 2026-08-07).
       Jasmine (melati) pinwheel: cream flower over a rotated navy under-layer,
       gold center, charcoal ground.
       SVG is the source of truth forever; later refinement path is Apple's
       Icon Composer (Xcode 26): import layers (flower / underlay / ground)
       for the light-dark-tinted Liquid Glass variants.
       Apple icon grid: 824x824 squircle centered, 100px margins. -->

  <defs>
    <path id="petal" d="M 0 -9 C -17 -13 -27 -34 -15 -47 C -7 -56 6 -54 10 -43 C 14 -29 9 -13 0 -9 Z"/>
    <g id="flower">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
    </g>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="#1C1C21"/>

  <g transform="translate(512,512) scale(5.311)">
    <!-- occluded pinwheel under-layer -->
    <g fill="#2E4A68" transform="rotate(-9) scale(1.035)">
      <use href="#flower"/>
    </g>
    <g fill="#F5F3EE">
      <use href="#flower"/>
    </g>
  </g>
  <circle cx="512" cy="512" r="33.8" fill="#E4C57C"/>
</svg>
