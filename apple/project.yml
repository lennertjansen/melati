name: Melati
options:
  bundleIdPrefix: com.lennertjansen
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
fileGroups:
  - Sources/Melati/Resources/en.lproj
  - Sources/Melati/Resources/nl.lproj

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 6VG5LWYXK5
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  Melati:
    build:
      targets:
        Melati: all
        MelatiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MelatiTests
  MelatiIOS:
    build:
      targets:
        MelatiIOS: all
        MelatiIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MelatiIOSTests

packages:
  SwiftSQLCipher:
    url: https://github.com/skiptools/swift-sqlcipher.git
    from: "1.9.0"

targets:
  Melati:
    type: application
    platform: macOS
    sources:
      - path: Sources/Melati
      - path: Sources/MelatiMac
        excludes:
          - "Info.plist"
          - "Melati.entitlements"
      - path: Resources
        excludes:
          - "editor"
      - path: Resources/editor
        type: folder
    dependencies:
      - package: SwiftSQLCipher
        product: SQLiteDB
    info:
      path: Sources/MelatiMac/Info.plist
      properties:
        CFBundleDisplayName: Melati
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        ATSApplicationFontsPath: .
    entitlements:
      path: Sources/MelatiMac/Melati.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Required for WKWebView's WebContent process to initialize, even when
        # only loading file:// URLs from the bundle. WebKit's helper processes
        # need network.client to start; without it WebContent crashes on launch.
        # network.client also carries CloudKit sync traffic now.
        com.apple.security.network.client: true
        # CloudKit sync (phase D). No push entitlement on mac dev builds:
        # CKSyncEngine's own scheduling + fetch-on-active cover it, and mac
        # push needs Developer ID provisioning (distribution-phase problem).
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.lennertjansen.melati
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lennertjansen.melati
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES

  MelatiIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Melati
      - path: Sources/MelatiIOS
        excludes:
          - "Info.plist"
          - "MelatiIOS.entitlements"
      - path: Resources
        excludes:
          - "editor"
      - path: Resources/editor
        type: folder
    dependencies:
      - package: SwiftSQLCipher
        product: SQLiteDB
    info:
      path: Sources/MelatiIOS/Info.plist
      properties:
        CFBundleDisplayName: Melati
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UIAppFonts:
          - Lora-Regular.ttf
          - Lora-Italic.ttf
          - Lora-Bold.ttf
          - Lora-BoldItalic.ttf
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Sources/MelatiIOS/MelatiIOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.lennertjansen.melati
        # CKSyncEngine registers its own CKDatabaseSubscription; this lets
        # the resulting silent pushes wake the app.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lennertjansen.melati
        PRODUCT_NAME: Melati
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # Hostless on purpose: a TEST_HOST launches the real app, which opens the
  # real diary DB and triggers keychain auth dialogs (hangs headless/CI runs).
  # Shared sources compile directly into the test bundle instead.
  MelatiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MelatiTests
      - path: Sources/Melati
    dependencies:
      - package: SwiftSQLCipher
        product: SQLiteDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Same test sources, iOS simulator: shared code (SQLCipher, sync logic,
  # policies) verified on the platform it actually ships on.
  MelatiIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MelatiTests
      - path: Sources/Melati
    dependencies:
      - package: SwiftSQLCipher
        product: SQLiteDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
