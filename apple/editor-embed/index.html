<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Melati Editor</title>
    <style>
      :root {
        --bg: #f5eedc;
        --fg: #2e2a26;
        --fg-subtle: #2e2a26b3;
        --caret: #2e2a26;
      }
      :root.dark {
        --bg: #1a1915;
        --fg: #e8e3d8;
        --fg-subtle: #e8e3d8b3;
        --caret: #ffffff;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Lora", "ui-serif", Georgia, serif;
        font-size: 18px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      body {
        overflow-y: auto;
      }
      #root {
        max-width: 65ch;
        margin: 0 auto;
        padding: 16px 24px 96px;
      }
      .ProseMirror {
        outline: none;
        min-height: 70vh;
        line-height: 1.55;
        caret-color: var(--caret);
      }
      /* iOS (class set by editor.ts): svh tracks the software keyboard's
         visual viewport; 70vh overshoots when the keyboard is up. Slightly
         larger touch line-height. Mac rendering untouched. */
      .platform-ios .ProseMirror {
        min-height: 60svh;
        line-height: 1.6;
      }
      .platform-ios #root {
        padding: 12px 20px 72px;
      }
      .ProseMirror p { margin: 0 0 1em; }
      .ProseMirror p.is-editor-empty:first-child::before {
        content: attr(data-placeholder);
        color: var(--fg-subtle);
        pointer-events: none;
        float: left;
        height: 0;
      }
      .ProseMirror h1 { font-size: 1.875em; font-weight: 700; margin: 0.75em 0 0.25em; }
      .ProseMirror h2 { font-size: 1.5em; font-weight: 700; margin: 0.75em 0 0.25em; }
      .ProseMirror h3 { font-size: 1.25em; font-weight: 600; margin: 0.75em 0 0.25em; }
      .ProseMirror ul { list-style-type: disc; padding-left: 1.5em; margin: 0.5em 0; }
      .ProseMirror ol { list-style-type: decimal; padding-left: 1.5em; margin: 0.5em 0; }
      .ProseMirror li > p { margin: 0; }
      .ProseMirror blockquote {
        border-left: 3px solid var(--fg-subtle);
        padding-left: 1em;
        margin: 0.5em 0;
        font-style: italic;
      }
      .ProseMirror pre {
        background: color-mix(in srgb, var(--fg) 8%, transparent);
        border-radius: 0.375em;
        padding: 0.75em 1em;
        margin: 0.5em 0;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .ProseMirror code {
        background: color-mix(in srgb, var(--fg) 8%, transparent);
        border-radius: 0.25em;
        padding: 0.15em 0.3em;
        font-size: 0.875em;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .ProseMirror pre code { background: none; padding: 0; border-radius: 0; font-size: 1em; }
      .ProseMirror hr {
        border: none;
        border-top: 1px solid var(--fg-subtle);
        margin: 1.25em 0;
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--fg) 25%, transparent);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/editor.ts"></script>
  </body>
</html>
