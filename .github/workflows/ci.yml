name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mac:
    name: Mac build + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apple/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apple
        run: xcodegen

      - name: Build and test
        working-directory: apple
        # No signing on CI: the runner has no team certificate, and since the
        # iCloud entitlements landed, even ad-hoc signing demands a
        # provisioning profile. Tests are hostless - nothing launches the app.
        run: |
          xcodebuild -project Noot.xcodeproj -scheme Noot \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test | tail -100

  ios:
    name: iOS build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-ios-${{ runner.os }}-${{ hashFiles('apple/project.yml') }}
          restore-keys: spm-ios-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apple
        run: xcodegen

      - name: Build for iOS Simulator
        working-directory: apple
        run: |
          xcodebuild -project Noot.xcodeproj -scheme NootIOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50

  lint:
    name: Lint + editor embed build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Biome check
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check

      - name: Editor embed builds
        working-directory: apple/editor-embed
        run: |
          npm ci
          npm run build
