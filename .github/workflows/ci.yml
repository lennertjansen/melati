name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mac:
    name: Mac build + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apple/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apple
        run: xcodegen

      - name: Build and test
        working-directory: apple
        # No signing on CI: the runner has no team certificate, and since the
        # iCloud entitlements landed, even ad-hoc signing demands a
        # provisioning profile. Tests are hostless - nothing launches the app.
        run: |
          xcodebuild -project Melati.xcodeproj -scheme Melati \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test | tail -100

  ios:
    name: iOS build + tests (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-ios-${{ runner.os }}-${{ hashFiles('apple/project.yml') }}
          restore-keys: spm-ios-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apple
        run: xcodegen

      - name: Build and test on iOS Simulator
        working-directory: apple
        # Concrete device picked at runtime: destination names churn with
        # every Xcode release, the first available iPhone does not.
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild -project Melati.xcodeproj -scheme MelatiIOS \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test | tail -100

  lint:
    name: Lint + editor embed build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Biome check
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check

      - name: Editor embed builds
        working-directory: apple/editor-embed
        run: |
          npm ci
          npm run build

      - name: Editor bundle drift check
        # The committed bundle (apple/Resources/editor) must be exactly what
        # editor-embed sources produce - catches source edits that forgot the
        # rebuild, and hand-edits to the generated bundle.
        run: |
          git status --porcelain -- apple/Resources/editor
          if ! git diff --quiet -- apple/Resources/editor \
            || [ -n "$(git status --porcelain -- apple/Resources/editor)" ]; then
            echo "::error::apple/Resources/editor drifted from editor-embed sources. Run 'npm run build' in apple/editor-embed and commit the result."
            git diff --stat -- apple/Resources/editor
            exit 1
          fi
