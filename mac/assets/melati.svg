<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Melati app icon — v3
       Asymmetric teardrop petal: pronounced bulge on right edge,
       near-straight left edge, tip biased CW from radial axis.
       6+6 layered with ~15° back offset.
       Charcoal field, cream front, slate-blue back, saffron dot. -->

  <defs>
    <!-- Asymmetric front petal pointing up, leaning CW.
         Right edge bulges to ~110px at y=-220.
         Left edge nearly vertical with subtle inward curve.
         Tip rounded, biased to right of vertical. -->
    <path id="petalFront"
      d="M 0 0
         C  30 -60   95 -150  110 -240
         C 120 -310  75 -360  20 -380
         C -10 -385 -28 -370 -22 -340
         C -16 -260  -8 -150   0  -50
         C   0 -25    0 -10    0   0 Z"/>

    <!-- Same shape, scaled smaller for back layer (~85% size). -->
    <path id="petalBack"
      d="M 0 0
         C  26 -52   82 -130   95 -208
         C 104 -270  65 -312  17 -330
         C  -9 -335 -24 -322 -19 -295
         C -14 -226  -7 -130   0  -42
         C   0 -22    0  -8    0   0 Z"/>
  </defs>

  <!-- Charcoal background -->
  <rect width="1024" height="1024" rx="184" ry="184" fill="#2E2A26"/>

  <g transform="translate(512 512)">
    <!-- Back layer: 6 slate-blue petals, rotated -15° (CCW = trailing shadow) -->
    <g fill="#5A6B85">
      <use href="#petalBack" transform="rotate(-15)"/>
      <use href="#petalBack" transform="rotate(45)"/>
      <use href="#petalBack" transform="rotate(105)"/>
      <use href="#petalBack" transform="rotate(165)"/>
      <use href="#petalBack" transform="rotate(225)"/>
      <use href="#petalBack" transform="rotate(285)"/>
    </g>

    <!-- Front layer: 6 cream-white petals at 0°, 60°, ... -->
    <g fill="#F5EEDC">
      <use href="#petalFront" transform="rotate(0)"/>
      <use href="#petalFront" transform="rotate(60)"/>
      <use href="#petalFront" transform="rotate(120)"/>
      <use href="#petalFront" transform="rotate(180)"/>
      <use href="#petalFront" transform="rotate(240)"/>
      <use href="#petalFront" transform="rotate(300)"/>
    </g>

    <!-- Saffron center dot -->
    <circle cx="0" cy="0" r="22" fill="#D9881F"/>
  </g>
</svg>
